name: Verify Hub
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node test-tours.cjs
      - run: node test-hub.cjs
      - run: node test-login.cjs
      - run: node test-login-flow.cjs
      - run: node test-modules.cjs
      - run: node test-auth.cjs

      - run: node --test cancellation.test.cjs promotions.test.cjs standardization.test.cjs hub-interface.test.cjs november-programs.test.cjs november-interface.test.cjs quality.test.cjs
